<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Индульгенция на отдых · Триатлон удовольствий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{--ink:#2A201A;--ink-soft:#6A5946;--oxblood:#5E0F1B;--oxblood-2:#7A1722;
    --gold:#9C7B2E;--gold-bright:#BD9846;--gold-pale:#E7D4A4;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);line-height:1.5;
    background:radial-gradient(120% 80% at 50% -20%, rgba(189,152,70,.16), transparent 60%),
      radial-gradient(circle at 85% 90%, rgba(94,15,27,.18), transparent 55%),linear-gradient(#1A120C,#0F0A07);
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px 56px;}
  .stage{width:100%;max-width:640px;}
  .langbar{display:flex;justify-content:center;gap:8px;margin-bottom:20px;}
  .langbtn{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.2em;color:var(--gold-pale);background:transparent;border:1px solid rgba(189,152,70,.45);padding:7px 17px;border-radius:1px;cursor:pointer;transition:.16s;}
  .langbtn:hover{border-color:var(--gold-bright);color:#fff;}
  .langbtn.active{background:var(--gold-bright);color:#16100A;border-color:var(--gold-bright);}

  .parchment{position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 30% 12%, rgba(255,252,245,.72), transparent 62%),
      radial-gradient(ellipse at 82% 92%, rgba(150,110,60,.16), transparent 55%),linear-gradient(165deg,#F7F0E2,#EBDEC4);
    border:1px solid #d3bd92;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 44px 90px -34px rgba(0,0,0,.82);padding:54px 46px 46px;}
  .edge-1,.edge-2{position:absolute;pointer-events:none;}
  .edge-1{top:14px;right:14px;bottom:14px;left:14px;border:1px solid var(--gold);opacity:.65;}
  .edge-2{top:18px;right:18px;bottom:18px;left:18px;border:.5px solid var(--oxblood);opacity:.45;}
  .corner{position:absolute;width:26px;height:26px;color:var(--gold);z-index:3;}
  .corner.tl{top:9px;left:9px;}.corner.tr{top:9px;right:9px;transform:scaleX(-1);}
  .corner.bl{bottom:9px;left:9px;transform:scaleY(-1);}.corner.br{bottom:9px;right:9px;transform:scale(-1,-1);}
  .watermark{position:absolute;top:55%;left:50%;transform:translate(-50%,-50%);width:64%;max-width:340px;color:var(--oxblood);opacity:.05;z-index:0;pointer-events:none;}
  .content{position:relative;z-index:2;}

  .eyebrow{text-align:center;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--oxblood);margin-bottom:14px;}
  .title{font-family:'Playfair Display',Georgia,serif;font-weight:800;text-align:center;font-size:clamp(34px,9vw,58px);letter-spacing:-.01em;line-height:1.02;color:var(--ink);margin:2px 0 6px;}
  .title.two small{display:block;font-family:'Playfair Display',serif;font-weight:700;font-size:.62em;color:var(--ink);letter-spacing:-.01em;}
  .sublatin{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--ink-soft);}
  .lede{text-align:center;font-size:19px;color:var(--ink-soft);max-width:460px;margin:18px auto 22px;font-weight:500;}
  .diamond{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold-bright);margin:16px 0;}
  .diamond::before,.diamond::after{content:"";height:1px;width:74px;background:linear-gradient(90deg,transparent,var(--gold-bright));}
  .diamond::after{background:linear-gradient(90deg,var(--gold-bright),transparent);}
  .diamond i{width:8px;height:8px;background:var(--gold-bright);transform:rotate(45deg);}

  #quizView{display:block;}
  .quiz-list{display:flex;flex-direction:column;gap:9px;margin:20px 0 8px;}
  .sin{display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;width:100%;padding:13px 16px;border:1px solid #d0ba8e;border-radius:2px;background:rgba(255,253,247,.4);font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:500;color:var(--ink);transition:.15s;}
  .sin:hover{border-color:var(--oxblood);background:rgba(255,253,247,.85);}
  .sin .box{flex:0 0 auto;width:22px;height:22px;border:1px solid var(--oxblood);border-radius:1px;display:flex;align-items:center;justify-content:center;color:var(--gold-pale);font-size:12px;}
  .sin .box::after{content:"✦";opacity:0;transition:.12s;}
  .sin.sel{background:rgba(94,15,27,.09);border-color:var(--oxblood);}
  .sin.sel .box{background:var(--oxblood);}
  .sin.sel .box::after{opacity:1;}
  .counter{text-align:center;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;color:var(--ink-soft);min-height:15px;margin:8px 0 4px;}
  .field{margin-top:18px;}
  .field label{display:block;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--oxblood);margin-bottom:7px;}
  .field input{width:100%;padding:14px 16px;font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--ink);background:rgba(255,253,247,.6);border:1px solid #d0ba8e;border-radius:1px;outline:none;transition:.18s;}
  .field input:focus{border-color:var(--oxblood);box-shadow:0 0 0 3px rgba(94,15,27,.1);background:#fffdf7;}
  .btn{display:block;width:100%;margin-top:20px;cursor:pointer;font-family:'Cinzel',serif;font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#F6ECD6;padding:17px;border:none;border-radius:1px;background:linear-gradient(180deg,var(--oxblood-2),var(--oxblood));box-shadow:0 10px 24px -9px rgba(94,15,27,.9),0 0 0 1px var(--gold) inset;transition:transform .12s,box-shadow .12s;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -9px rgba(94,15,27,.95),0 0 0 1px var(--gold-bright) inset;}
  .btn:active{transform:translateY(0);}
  .fine{text-align:center;font-size:16px;color:var(--ink-soft);margin-top:16px;font-style:italic;opacity:.85;}
  .err{color:var(--oxblood);font-size:16px;margin-top:8px;min-height:18px;font-style:italic;text-align:center;}

  #certView{display:none;}#certView.show{display:block;}
  .cert-doc{text-align:center;}
  .cert-body{font-size:19px;color:var(--ink);font-weight:500;max-width:440px;margin-left:auto;margin-right:auto;}
  .name-wrap{margin:14px 0 4px;}
  .cert-name{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(30px,8vw,46px);color:var(--oxblood);line-height:1.06;}
  .rankbadge{display:inline-block;font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--oxblood);border:1px solid var(--gold-bright);border-radius:2px;padding:8px 18px;margin:12px 0 14px;background:rgba(189,152,70,.10);}
  .ch{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--oxblood);margin:16px 0 6px;text-align:center;}
  .clist{text-align:left;max-width:440px;margin:6px auto 4px;}
  .clist li{list-style:none;padding:5px 0 5px 28px;position:relative;font-size:18px;font-weight:500;}
  .clist li::before{content:"✦";position:absolute;left:5px;color:var(--gold-bright);font-size:12px;top:8px;}
  .frieze{display:flex;align-items:center;justify-content:center;gap:18px;color:var(--gold);margin:18px 0 4px;}
  .frieze svg{width:30px;height:30px;}
  .frieze .dot{width:3px;height:3px;border-radius:50%;background:var(--gold-bright);}

  .tri-h{font-family:'Playfair Display',serif;font-weight:700;font-style:italic;font-size:24px;color:var(--oxblood);text-align:center;margin-top:6px;}
  .tri-sub{font-style:italic;color:var(--ink-soft);font-size:16px;max-width:440px;margin:6px auto 10px;text-align:center;}
  .tri{max-width:430px;margin:8px auto 4px;text-align:left;}
  .tri-row{display:flex;gap:14px;align-items:baseline;padding:9px 2px;border-bottom:1px solid rgba(189,152,70,.28);}
  .tri-row:last-child{border-bottom:none;}
  .tri-cat{flex:0 0 116px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--oxblood);padding-top:2px;}
  .tri-act{font-size:18.5px;font-weight:500;color:var(--ink);}
  .tri-note{font-style:italic;color:var(--ink-soft);font-size:14px;text-align:center;margin-top:10px;opacity:.85;}
  .closing{text-align:center;font-style:italic;font-size:20px;color:var(--oxblood);max-width:420px;margin:16px auto 4px;}

  .seal-wrap{display:flex;justify-content:center;margin:20px 0 6px;}
  .wax{width:114px;height:114px;animation:stamp .75s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes stamp{0%{transform:scale(2.2) rotate(-14deg);opacity:0;}60%{opacity:1;}100%{transform:scale(1) rotate(-4deg);opacity:1;}}
  .issued{text-align:center;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px;line-height:1.7;}
  .motto{text-align:center;font-style:italic;font-size:17px;color:var(--gold);margin-top:6px;}
  .brandline{text-align:center;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--oxblood);margin-top:12px;opacity:.9;}

  .actions{display:flex;gap:12px;margin-top:24px;}
  .cta,.cta2{flex:1;cursor:pointer;font-family:'Cinzel',serif;font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;padding:16px;border-radius:1px;transition:transform .12s;}
  .cta{border:none;color:#1A120C;background:linear-gradient(180deg,#D4AE5A,#BD9846);box-shadow:0 12px 26px -10px rgba(189,152,70,.7);}
  .cta:hover{transform:translateY(-2px);}
  .cta2{background:transparent;color:var(--gold-pale);border:1px solid rgba(189,152,70,.5);}
  .cta2:hover{transform:translateY(-2px);border-color:var(--gold-bright);}
  .textlink{display:block;margin:16px auto 0;background:none;border:none;color:var(--gold-pale);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;cursor:pointer;opacity:.85;}
  .textlink:hover{opacity:1;text-decoration:underline;}
  .subscribe{margin-top:30px;text-align:center;padding-top:24px;border-top:1px solid rgba(189,152,70,.25);}
  .sub-h{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--gold-pale);margin-bottom:14px;}
  .sub-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .sub-links a{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-pale);border:1px solid rgba(189,152,70,.5);padding:11px 18px;border-radius:1px;text-decoration:none;transition:.15s;}
  .sub-links a:hover{background:var(--gold-bright);color:#1A120C;border-color:var(--gold-bright);}
  .counter-line{margin-top:18px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(231,212,164,.65);min-height:14px;}

  .overlay{position:fixed;inset:0;background:rgba(16,11,7,.94);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px;}
  .overlay.show{display:flex;}
  .overlay img{max-width:100%;max-height:64vh;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.6);}
  .overlay p{color:#f0e6d2;font-size:16px;text-align:center;max-width:360px;}
  .overlay .ov-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .overlay a,.overlay button{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:12px 18px;border-radius:1px;text-decoration:none;cursor:pointer;border:none;}
  .overlay .tg{background:#2AABEE;color:#fff;}
  .overlay .dl{background:var(--gold-bright);color:#231a10;}
  .overlay .cl{background:transparent;color:#f0e6d2;border:1px solid #8a7a60;}

  @media (max-width:520px){.parchment{padding:48px 24px 38px;}.wax{width:102px;height:102px;}.frieze{gap:13px;}.actions{flex-direction:column;}.tri-cat{flex-basis:100px;}}
  @media (prefers-reduced-motion:reduce){.wax{animation:none;transform:rotate(-4deg);}.btn,.cta,.cta2{transition:none;}}
</style>
</head>
<body>
<div class="stage">
  <div class="langbar"><button class="langbtn active" data-lang="ru">RU</button><button class="langbtn" data-lang="en">EN</button></div>

  <!-- QUIZ + NAME -->
  <div class="parchment" id="quizView">
    <div class="edge-1"></div><div class="edge-2"></div>
    <svg class="corner tl" viewBox="0 0 26 26" fill="none"><path d="M3 25V9C3 5 5 3 9 3H25" stroke="currentColor" stroke-width="1.4"/><path d="M8 25V13c0-3 2-5 5-5h12" stroke="currentColor" stroke-width=".7"/></svg>
    <svg class="corner tr" viewBox="0 0 26 26" fill="none"><path d="M3 25V9C3 5 5 3 9 3H25" stroke="currentColor" stroke-width="1.4"/><path d="M8 25V13c0-3 2-5 5-5h12" stroke="currentColor" stroke-width=".7"/></svg>
    <svg class="corner bl" viewBox="0 0 26 26" fill="none"><path d="M3 25V9C3 5 5 3 9 3H25" stroke="currentColor" stroke-width="1.4"/><path d="M8 25V13c0-3 2-5 5-5h12" stroke="currentColor" stroke-width=".7"/></svg>
    <svg class="corner br" viewBox="0 0 26 26" fill="none"><path d="M3 25V9C3 5 5 3 9 3H25" stroke="currentColor" stroke-width="1.4"/><path d="M8 25V13c0-3 2-5 5-5h12" stroke="currentColor" stroke-width=".7"/></svg>
    <div class="content">
      <p class="eyebrow" data-i18n="q_eyebrow"></p>
      <h1 class="title two"><span data-i18n="q_title"></span><small data-i18n="q_title_small"></small></h1>
      <p class="sublatin">confiteor otium</p>
      <p class="lede" data-i18n="q_lede"></p>
      <div class="quiz-list" id="quizList"></div>
      <p class="counter" id="counter"></p>
      <div class="field"><label data-i18n="q_name_label"></label><input id="name" type="text" autocomplete="name" data-i18n-ph="q_name_ph"></div>
      <p class="err" id="quizErr"></p>
      <button class="btn" id="issueBtn" data-i18n="q_issue"></button>
      <p class="fine" data-i18n="q_fine"></p>
    </div>
  </div>

  <!-- CERTIFICATE -->
  <div id="certView">
    <div class="parchment" id="certCard">
      <div class="edge-1"></div><div class="edge-2"></div>
      <svg class="corner tl" viewBox="0 0 26 26" fill="none"><path d="M3 25V9C3 5 5 3 9 3H25" stroke="currentColor" stroke-width="1.4"/><path d="M8 25V13c0-3 2-5 5-5h12" stroke="currentColor" stroke-width=".7"/></svg>
      <svg class="corner tr" viewBox="0 0 26 26" fill="none"><path d="M3 25V9C3 5 5 3 9 3H25" stroke="currentColor" stroke-width="1.4"/><path d="M8 25V13c0-3 2-5 5-5h12" stroke="currentColor" stroke-width=".7"/></svg>
      <svg class="corner bl" viewBox="0 0 26 26" fill="none"><path d="M3 25V9C3 5 5 3 9 3H25" stroke="currentColor" stroke-width="1.4"/><path d="M8 25V13c0-3 2-5 5-5h12" stroke="currentColor" stroke-width=".7"/></svg>
      <svg class="corner br" viewBox="0 0 26 26" fill="none"><path d="M3 25V9C3 5 5 3 9 3H25" stroke="currentColor" stroke-width="1.4"/><path d="M8 25V13c0-3 2-5 5-5h12" stroke="currentColor" stroke-width=".7"/></svg>
      <svg class="watermark" viewBox="0 0 200 200">
        <g fill="none" stroke="currentColor" stroke-width="2"><circle cx="100" cy="100" r="94"/><circle cx="100" cy="100" r="82"/></g>
        <g fill="currentColor"><ellipse cx="84" cy="118" rx="30" ry="40"/><ellipse cx="108" cy="122" rx="20" ry="34"/><ellipse cx="113" cy="92" rx="13" ry="22"/><circle cx="123" cy="66" r="20"/><ellipse cx="145" cy="72" rx="15" ry="8"/><path d="M117 50 L108 30 L125 47 Z"/><rect x="100" y="120" width="8" height="44" rx="4"/><rect x="116" y="122" width="8" height="42" rx="4"/><path d="M56 120 C42 113 40 96 53 86 C57 93 55 105 65 112 Z"/><ellipse cx="146" cy="76" rx="3.4" ry="2.6"/></g>
      </svg>
      <div class="content cert-doc" id="certDoc">
        <p class="eyebrow" data-i18n="c_eyebrow"></p>
        <h1 class="title" data-i18n="c_title"></h1>
        <p class="sublatin" data-i18n="c_sublatin"></p>
        <div class="diamond"><i></i></div>
        <p class="cert-body" data-i18n="c_intro1"></p>
        <div class="name-wrap"><div class="cert-name" id="certName">Имя</div></div>
        <div class="rankbadge" id="certRank"></div>
        <p class="cert-body" data-i18n="c_intro2"></p>
        <ul class="clist" id="sinList"></ul>
        <div class="ch" data-i18n="c_ch_remedies"></div>
        <ul class="clist" id="remedyList"></ul>
        <div class="frieze">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><ellipse cx="16" cy="12" rx="7" ry="9"/><line x1="12" y1="5" x2="12" y2="19"/><line x1="20" y1="5" x2="20" y2="19"/><line x1="9" y1="9" x2="23" y2="9"/><line x1="9" y1="15" x2="23" y2="15"/><line x1="16" y1="21" x2="16" y2="29"/></svg>
          <span class="dot"></span>
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><line x1="16" y1="4" x2="16" y2="22"/><path d="M16 5 L16 21 L5 21 Z"/><path d="M18 7 L18 21 L27 21 Z"/><path d="M5 22 H27 L23 28 H9 Z"/></svg>
          <span class="dot"></span>
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="9" y1="4" x2="9" y2="28"/><path d="M9 4 L23 8 L9 12 Z" fill="currentColor" stroke="none"/><line x1="3" y1="28" x2="21" y2="28"/><circle cx="15" cy="25" r="2" fill="currentColor" stroke="none"/></svg>
          <span class="dot"></span>
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M6 8 C12 5 16 5 16 8 C16 5 20 5 26 8 L26 24 C20 21 16 21 16 24 C16 21 12 21 6 24 Z"/><line x1="16" y1="8" x2="16" y2="24"/></svg>
        </div>
        <p class="tri-h" data-i18n="tri_heading"></p>
        <p class="tri-sub" data-i18n="tri_sub"></p>
        <div class="tri" id="triBlock"></div>
        <p class="tri-note" data-i18n="tri_note"></p>
        <p class="closing" data-i18n="c_closing"></p>
        <div class="seal-wrap">
          <svg class="wax" viewBox="0 0 120 120" aria-label="seal">
            <defs><radialGradient id="waxg" cx="38%" cy="32%" r="80%"><stop offset="0%" stop-color="#9d2230"/><stop offset="52%" stop-color="#741521"/><stop offset="100%" stop-color="#460a13"/></radialGradient></defs>
            <circle cx="60" cy="60" r="52" fill="url(#waxg)"/>
            <circle cx="60" cy="60" r="46" fill="none" stroke="#e0ab48" stroke-width="1.1" opacity=".85"/>
            <circle cx="60" cy="60" r="36" fill="none" stroke="#e0ab48" stroke-width=".7" opacity=".55"/>
            <path id="arc" d="M60 18 a42 42 0 1 1 -0.1 0" fill="none"/>
            <text fill="#ecbf5e" font-family="Cinzel, serif" font-size="6.6" letter-spacing="2.4"><textPath id="sealRing" href="#arc" startOffset="2%"></textPath></text>
            <text id="sealMono" x="60" y="66" text-anchor="middle" fill="#ecbf5e" font-family="Playfair Display, serif" font-weight="700" font-size="26"></text>
          </svg>
        </div>
        <p class="issued"><span data-i18n="c_issued_by"></span> · №<span id="serial">000</span> · <span id="issueDate"></span></p>
        <p class="motto" data-i18n="c_motto"></p>
        <p class="brandline" id="brandLine"></p>
      </div>
    </div>
    <div class="actions">
      <button class="cta" id="shareBtn" data-i18n="c_share"></button>
      <button class="cta2" id="downloadBtn" data-i18n="c_save"></button>
    </div>
    <button class="textlink" id="againBtn" data-i18n="c_again"></button>
    <div class="subscribe">
      <p class="sub-h" data-i18n="sub_heading"></p>
      <div class="sub-links" id="subLinks"></div>
      <p class="counter-line" id="counterLine"></p>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <p id="ovText"></p>
  <img id="ovImg" alt="indulgence">
  <div class="ov-actions">
    <a class="tg" id="ovTg" target="_blank" rel="noopener"></a>
    <a class="dl" id="ovDownload" download="indulgence.png"></a>
    <button class="cl" id="ovClose"></button>
  </div>
</div>

<script>
  /* ====== НАСТРОЙКИ ====== */

  let cur="ru"; const selected=new Set(); let state=null; let lastDataURL=null, lastFile=null, lastName="indulgence";
  function rankOf(lang,n){ const r=I18N[lang].ranks; if(n<=2)return r[0]; if(n<=4)return r[1]; if(n<=6)return r[2]; if(n<=8)return r[3]; return r[4]; }

  function buildQuiz(){
    const list=$('#quizList'); list.innerHTML='';
    I18N[cur].sins.forEach((s,i)=>{
      const b=document.createElement('button'); b.type='button'; b.className='sin'+(selected.has(i)?' sel':''); b.dataset.i=i;
      b.innerHTML='<span class="box"></span><span>'+s+'</span>';
      b.addEventListener('click',()=>{ if(selected.has(i)){selected.delete(i);b.classList.remove('sel');}else{selected.add(i);b.classList.add('sel');} $('#counter').textContent=I18N[cur].counter+selected.size; $('#quizErr').textContent=''; });
      list.appendChild(b);
    });
  }
  function buildSocial(){ const w=$('#subLinks'); w.innerHTML=''; SOCIAL.forEach(s=>{ const a=document.createElement('a'); a.href=s.url; a.target='_blank'; a.rel='noopener'; a.textContent=s.label; w.appendChild(a); }); }
  function fmtDate(d){ const t=I18N[cur]; return d.toLocaleDateString(t.date_locale,{day:'numeric',month:'long',year:'numeric'})+t.date_suffix; }

  function renderCert(){ if(!state)return; const t=I18N[cur];
    $('#certName').textContent=state.name;
    $('#certRank').textContent='✦ '+rankOf(cur,state.indices.length)+' ✦';
    $('#serial').textContent=state.serial; $('#issueDate').textContent=fmtDate(state.dateObj);
    $('#sinList').innerHTML=state.indices.map(i=>'<li>'+t.sins[i]+'</li>').join('');
    $('#remedyList').innerHTML=state.indices.map(i=>'<li>'+t.remedies[i][state.remedy[i]]+'</li>').join('');
    const rows=[[t.tri_body_label,t.triBody[state.tri.b]],[t.tri_mind_label,t.triMind[state.tri.m]],[t.tri_rest_label,t.triRest[state.tri.r]]];
    $('#triBlock').innerHTML=rows.map(r=>'<div class="tri-row"><span class="tri-cat">'+r[0]+'</span><span class="tri-act">'+r[1]+'</span></div>').join('');
    $('#brandLine').textContent=BRAND_HANDLE;
  }
  function applyLang(lang){ cur=lang; const t=I18N[lang]; document.documentElement.lang=lang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.dataset.i18n; if(t[k]!==undefined) el.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder=t[el.dataset.i18nPh]; });
    $('#sealRing').textContent=t.seal_ring; $('#sealMono').textContent=t.seal_mono;
    buildQuiz(); $('#counter').textContent=t.counter+selected.size;
    document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
    if($('#certView').classList.contains('show')) renderCert();
  }

  async function makeImage(){ await (document.fonts?document.fonts.ready:Promise.resolve()); await new Promise(r=>setTimeout(r,150)); const c=await html2canvas($('#certCard'),{scale:2,backgroundColor:null,useCORS:true,logging:false}); return c.toDataURL('image/png'); }

  async function bumpCounter(){ if(!COUNTER_ENABLED) return;
    try{ const r=await fetch('https://abacus.jasoncameron.dev/hit/'+COUNTER_NS+'/'+COUNTER_KEY); const d=await r.json(); const n=d.value??d.count;
      if(typeof n==='number') $('#counterLine').textContent=I18N[cur].counter_label+n.toLocaleString(cur==='ru'?'ru-RU':'en-GB'); }catch(e){}
  }

  async function issue(){
    const t=I18N[cur]; const name=$('#name').value.trim();
    if(selected.size===0){ $('#quizErr').textContent=t.err_quiz; return; }
    if(!name){ $('#quizErr').textContent=t.err_name; return; }
    $('#quizErr').textContent='';
    const indices=[...selected]; const remedy={}; indices.forEach(i=>{ remedy[i]=rnd(I18N.ru.remedies[i].length); });
    const tri={ b:rnd(I18N.ru.triBody.length), m:rnd(I18N.ru.triMind.length), r:rnd(I18N.ru.triRest.length) };
    state={ name, indices, remedy, tri, serial:String(Math.floor(100+Math.random()*900)), dateObj:new Date() };
    lastName=name.replace(/\s+/g,'_'); lastDataURL=null; lastFile=null; renderCert();
    $('#quizView').style.display='none'; $('#certView').classList.add('show'); window.scrollTo({top:0,behavior:'smooth'});
    bumpCounter();
    try{ lastDataURL=await makeImage(); $('#ovImg').src=lastDataURL; $('#ovDownload').href=lastDataURL;
      const blob=await (await fetch(lastDataURL)).blob(); lastFile=new File([blob],'indulgence-'+lastName+'.png',{type:'image/png'}); }catch(e){ console.warn(e); }
  }

  function restart(){ $('#certView').classList.remove('show'); selected.clear(); buildQuiz(); $('#counter').textContent=I18N[cur].counter+'0'; $('#name').value=''; $('#quizErr').textContent=''; state=null; lastDataURL=null; lastFile=null; $('#quizView').style.display='block'; window.scrollTo({top:0,behavior:'smooth'}); }

  function shareText(){ const t=I18N[cur]; return t.share_text.replace('{rank}', state?rankOf(cur,state.indices.length):''); }
  function openOverlay(){ const t=I18N[cur]; $('#ovText').textContent=t.ov_text; $('#ovTg').textContent=t.ov_tg; $('#ovDownload').textContent=t.ov_dl; $('#ovClose').textContent=t.ov_close;
    if(lastDataURL){ $('#ovImg').src=lastDataURL; $('#ovDownload').href=lastDataURL; }
    $('#ovTg').href='https://t.me/share/url?url='+encodeURIComponent(SITE_URL)+'&text='+encodeURIComponent(shareText());
    $('#overlay').classList.add('show');
  }

  async function shareCert(){
    try{
      if(lastFile && navigator.canShare && navigator.canShare({files:[lastFile]})){ await navigator.share({ files:[lastFile], text:shareText()+' '+SITE_URL }); return; }
      if(navigator.share){ await navigator.share({ text:shareText(), url:SITE_URL }); return; }
    }catch(e){ if(e && e.name==='AbortError') return; }
    openOverlay();
  }
  async function saveCert(){
    const btn=$('#downloadBtn'); btn.disabled=true; const old=btn.textContent; btn.textContent='…';
    try{ if(!lastDataURL){ lastDataURL=await makeImage(); } const fname='indulgence-'+lastName+'.png';
      $('#ovDownload').setAttribute('download',fname);
      const a=document.createElement('a'); a.href=lastDataURL; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
      openOverlay();
    }catch(e){ console.error(e); alert('Could not render image / Не удалось подготовить картинку.'); }
    finally{ btn.disabled=false; btn.textContent=old; }
  }

  document.querySelectorAll('.langbtn').forEach(b=>b.addEventListener('click',()=>applyLang(b.dataset.lang)));
  $('#issueBtn').addEventListener('click',issue);
  $('#name').addEventListener('keydown',e=>{ if(e.key==='Enter') issue(); });
  $('#shareBtn').addEventListener('click',shareCert);
  $('#downloadBtn').addEventListener('click',saveCert);
  $('#againBtn').addEventListener('click',restart);
  $('#ovClose').addEventListener('click',()=>$('#overlay').classList.remove('show'));
  $('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') $('#overlay').classList.remove('show'); });
  buildSocial(); applyLang('ru');
</script>
